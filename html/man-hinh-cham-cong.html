<!DOCTYPE html>

<html class="light" lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#0070eb",
                        "on-secondary-fixed": "#161c22",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#414755",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#c64f00",
                        "on-tertiary-fixed-variant": "#7c2e00",
                        "surface-dim": "#d8d9e5",
                        "surface-tint": "#005bc1",
                        "background": "#f9f9ff",
                        "surface-bright": "#f9f9ff",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#eef0fc",
                        "on-tertiary-container": "#fffbff",
                        "on-secondary-container": "#5f656c",
                        "on-background": "#181c23",
                        "on-primary-fixed-variant": "#004493",
                        "inverse-surface": "#2d3039",
                        "surface-container": "#ecedf9",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#e6e8f3",
                        "secondary-fixed": "#dee3eb",
                        "on-secondary": "#ffffff",
                        "tertiary": "#9e3d00",
                        "surface": "#f9f9ff",
                        "tertiary-fixed": "#ffdbcc",
                        "on-primary": "#ffffff",
                        "secondary-container": "#dee3eb",
                        "inverse-primary": "#adc6ff",
                        "outline": "#717786",
                        "on-surface": "#181c23",
                        "primary-fixed": "#d8e2ff",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#42474e",
                        "on-primary-fixed": "#001a41",
                        "surface-container-low": "#f1f3fe",
                        "primary-fixed-dim": "#adc6ff",
                        "surface-variant": "#e0e2ed",
                        "on-tertiary-fixed": "#351000",
                        "surface-container-highest": "#e0e2ed",
                        "secondary": "#595f66",
                        "primary": "#0058bc",
                        "tertiary-fixed-dim": "#ffb595",
                        "on-primary-container": "#fefcff",
                        "secondary-fixed-dim": "#c2c7cf",
                        "outline-variant": "#c1c6d7"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base-unit": "4px",
                        "gutter-card": "12px",
                        "margin-page": "16px",
                        "padding-element": "16px",
                        "stack-gap": "8px"
                    },
                    "fontFamily": {
                        "label-caps": ["Manrope"],
                        "body-main": ["Manrope"],
                        "display-time": ["Manrope"],
                        "heading-md": ["Manrope"],
                        "status-text": ["Manrope"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "body-main": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-time": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "heading-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "status-text": ["13px", { "lineHeight": "18px", "fontWeight": "500" }]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .pulse-outer {
            box-shadow: 0 0 0 0 rgba(0, 88, 188, 0.4);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background font-body-main text-on-background min-h-screen pb-24">
    <!-- Top Navigation -->
    <header
        class="bg-white dark:bg-slate-900 shadow-sm border-b border-slate-100 dark:border-slate-800 flex justify-between items-center px-4 h-16 w-full sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <button class="p-2 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-full transition-colors duration-200">
                <span class="material-symbols-outlined text-on-surface">arrow_back</span>
            </button>
            <h1 class="font-manrope text-lg font-bold text-on-surface">Chấm công</h1>
        </div>
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-blue-600 dark:text-blue-400">notifications</span>
            <div class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden">
                <img alt="Employee Profile Picture"
                    data-alt="Professional headshot of a smiling employee in business casual attire with a soft neutral background"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuCZFklDf2S4Tl3gZux6T5viZ7-Wg6akJda73mY7ThotTdK8xUamjREKT8OGgrBuCIZVXBUm2y4QcpHDUTvgM2TO378z4UR4v3e9_OGqiY0j-1f12V4Mt0Z0wHW-cNpMMicDgMAcWYQAaS7nyHDb_kzgoyGNf7rfe60-xv0VvK5kQr_cfYGQ-VsUtFTgV-19TUVTerrIRb8ukMblRtsjVlRyFbG9WA7uiM3B4ROU91z4epNIsx30667ob2jMB_Z0nO8i_1Z3mfZDww" />
            </div>
        </div>
    </header>
    <main class="px-margin-page pt-stack-gap space-y-6">
        <!-- Date and Time Card -->
        <section class="text-center mt-8">
            <p class="font-label-caps text-label-caps text-on-surface-variant mb-1">Thứ 6, 24/05/2024</p>
            <h2 class="font-display-time text-display-time text-primary">08:00:15</h2>
        </section>
        <!-- Shift Selector -->
        <div class="relative">
            <label class="font-label-caps text-label-caps text-on-surface-variant block mb-2 px-1">Chọn ca làm
                việc</label>
            <button
                class="w-full flex items-center justify-between bg-white border border-outline-variant px-padding-element py-3 rounded-xl shadow-sm">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-primary">schedule</span>
                    <span class="font-heading-md text-heading-md text-on-surface">Ca hành chính</span>
                </div>
                <span class="material-symbols-outlined">expand_more</span>
            </button>
        </div>
        <!-- Main Check-in Action -->
        <div class="flex flex-col items-center justify-center py-8">
            <div class="relative">
                <!-- Visual Pulsing Effect Rings (Static for UI) -->
                <div class="absolute inset-0 rounded-full bg-primary/10 scale-125"></div>
                <div class="absolute inset-0 rounded-full bg-primary/5 scale-150"></div>
                <button
                    class="relative w-48 h-48 rounded-full bg-primary flex flex-col items-center justify-center text-white shadow-xl active:scale-95 transition-transform duration-150">
                    <span class="material-symbols-outlined text-5xl mb-2"
                        style="font-variation-settings: 'FILL' 1;">fingerprint</span>
                    <p class="font-label-caps text-label-caps uppercase tracking-wider text-white/90">CHẤM CÔNG</p>
                    <p class="font-heading-md text-heading-md font-bold">Giờ vào</p>
                </button>
            </div>
        </div>
        <!-- Location Status Card -->
        <div class="bg-primary-container/5 border border-primary-container/20 rounded-2xl p-padding-element">
            <div class="flex items-start gap-3">
                <div class="bg-primary-container p-2 rounded-full">
                    <span class="material-symbols-outlined text-white text-sm"
                        style="font-variation-settings: 'FILL' 1;">location_on</span>
                </div>
                <div class="flex-1">
                    <h3 class="font-status-text text-status-text text-primary-container font-bold mb-1">Bạn đang ở trong
                        khu vực cho phép</h3>
                    <p class="text-sm text-on-surface-variant leading-tight">285 Cách Mạng Tháng Tám, Phường 12, Quận
                        10, TP. Hồ Chí Minh</p>
                    <button class="mt-2 text-primary font-bold text-sm flex items-center gap-1">
                        Xem bản đồ
                        <span class="material-symbols-outlined text-xs">open_in_new</span>
                    </button>
                </div>
            </div>
        </div>
        <!-- Work Info Section -->
        <section class="space-y-3">
            <h3 class="font-heading-md text-heading-md text-on-surface px-1">Thông tin ca làm việc</h3>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-padding-element rounded-xl shadow-sm border border-slate-100">
                    <p class="text-xs text-on-surface-variant mb-1">Thời gian</p>
                    <p class="font-bold text-on-surface">08:00 - 17:30</p>
                </div>
                <div class="bg-white p-padding-element rounded-xl shadow-sm border border-slate-100">
                    <p class="text-xs text-on-surface-variant mb-1">Nghỉ trưa</p>
                    <p class="font-bold text-on-surface">12:00 - 13:30</p>
                </div>
            </div>
            <div
                class="bg-white p-padding-element rounded-xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-orange-50 flex items-center justify-center">
                        <span class="material-symbols-outlined text-orange-500">info</span>
                    </div>
                    <div>
                        <p class="text-xs text-on-surface-variant">Trạng thái hôm nay</p>
                        <p class="font-bold text-on-surface">Chưa ghi nhận giờ vào</p>
                    </div>
                </div>
                <span
                    class="bg-orange-100 text-orange-700 text-[10px] px-2 py-1 rounded-full font-bold uppercase">Pending</span>
            </div>
        </section>
    </main>
    <!-- Bottom Navigation Shell -->
    <nav
        class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 py-3 pb-safe bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-t border-slate-100 dark:border-slate-800 shadow-[0_-2px_10px_rgba(0,0,0,0.06)]">
        <button
            class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-blue-500 transition-transform duration-150 scale-95 active:scale-90">
            <span class="material-symbols-outlined">home</span>
            <span class="font-manrope text-[10px] font-semibold">Home</span>
        </button>
        <button
            class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-blue-500 transition-transform duration-150 scale-95 active:scale-90">
            <span class="material-symbols-outlined">history</span>
            <span class="font-manrope text-[10px] font-semibold">History</span>
        </button>
        <button
            class="flex flex-col items-center justify-center text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 rounded-xl px-3 py-1 transition-transform duration-150 scale-95 active:scale-90">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
            <span class="font-manrope text-[10px] font-semibold">Check-in</span>
        </button>
        <button
            class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-blue-500 transition-transform duration-150 scale-95 active:scale-90">
            <span class="material-symbols-outlined">event_note</span>
            <span class="font-manrope text-[10px] font-semibold">Request</span>
        </button>
        <button
            class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-blue-500 transition-transform duration-150 scale-95 active:scale-90">
            <span class="material-symbols-outlined">person</span>
            <span class="font-manrope text-[10px] font-semibold">Profile</span>
        </button>
    </nav>
</body>

</html>
