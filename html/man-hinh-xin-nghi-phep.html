<!DOCTYPE html>

<html class="light" lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#0070eb",
                        "on-secondary-fixed": "#161c22",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#414755",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#c64f00",
                        "on-tertiary-fixed-variant": "#7c2e00",
                        "surface-dim": "#d8d9e5",
                        "surface-tint": "#005bc1",
                        "background": "#f9f9ff",
                        "surface-bright": "#f9f9ff",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#eef0fc",
                        "on-tertiary-container": "#fffbff",
                        "on-secondary-container": "#5f656c",
                        "on-background": "#181c23",
                        "on-primary-fixed-variant": "#004493",
                        "inverse-surface": "#2d3039",
                        "surface-container": "#ecedf9",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#e6e8f3",
                        "secondary-fixed": "#dee3eb",
                        "on-secondary": "#ffffff",
                        "tertiary": "#9e3d00",
                        "surface": "#f9f9ff",
                        "tertiary-fixed": "#ffdbcc",
                        "on-primary": "#ffffff",
                        "secondary-container": "#dee3eb",
                        "inverse-primary": "#adc6ff",
                        "outline": "#717786",
                        "on-surface": "#181c23",
                        "primary-fixed": "#d8e2ff",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#42474e",
                        "on-primary-fixed": "#001a41",
                        "surface-container-low": "#f1f3fe",
                        "primary-fixed-dim": "#adc6ff",
                        "surface-variant": "#e0e2ed",
                        "on-tertiary-fixed": "#351000",
                        "surface-container-highest": "#e0e2ed",
                        "secondary": "#595f66",
                        "primary": "#0058bc",
                        "tertiary-fixed-dim": "#ffb595",
                        "on-primary-container": "#fefcff",
                        "secondary-fixed-dim": "#c2c7cf",
                        "outline-variant": "#c1c6d7"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base-unit": "4px",
                        "gutter-card": "12px",
                        "margin-page": "16px",
                        "padding-element": "16px",
                        "stack-gap": "8px"
                    },
                    "fontFamily": {
                        "label-caps": ["Manrope"],
                        "body-main": ["Manrope"],
                        "display-time": ["Manrope"],
                        "heading-md": ["Manrope"],
                        "status-text": ["Manrope"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "body-main": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-time": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "heading-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "status-text": ["13px", { "lineHeight": "18px", "fontWeight": "500" }]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }

        body {
            font-family: 'Manrope', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-surface text-on-surface min-h-screen pb-24">
    <!-- Top App Bar -->
    <header
        class="bg-white dark:bg-slate-900 shadow-sm border-b border-slate-100 dark:border-slate-800 flex justify-between items-center px-4 h-16 w-full sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <button
                class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                <span class="material-symbols-outlined text-on-surface">arrow_back</span>
            </button>
            <h1 class="font-manrope text-lg font-bold text-on-surface">Xin nghỉ phép</h1>
        </div>
        <div class="flex items-center">
            <div class="w-8 h-8 rounded-full bg-slate-200 overflow-hidden ring-2 ring-primary-fixed">
                <img alt="Employee Profile Picture" class="w-full h-full object-cover"
                    data-alt="Close-up professional headshot of a smiling employee in business casual attire with a soft blurred office background"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuDNe1tolfrWijfauR6gh7McJ43z7INOdAXNLx5R7Dt_YDVFRqt1vcGvgfw2-4N4r89nmxLJW7aNN49o0l83R0t3y8J6HNXRGYilVC4NcYLzA5wEiuQ0ydFM-G481dzreRhSJLzFVTWQiKJrXoVzsizn5YI4y9Kz43xatyUvMY7LywFtnmrwMHCjILfKYooOnoVi3v4np34iwgH9SaswaOiiiqoU7hE2iyJZdN5cCYVwIjfjOCPvMaibmxPMOpn_aiTta7wKCV786Q" />
            </div>
        </div>
    </header>
    <main class="max-w-md mx-auto px-4 mt-6">
        <!-- Navigation Tabs -->
        <div class="flex bg-surface-container-low p-1 rounded-xl mb-6">
            <button
                class="flex-1 py-2 text-center rounded-lg bg-white shadow-sm text-primary font-heading-md text-heading-md">
                Nghỉ phép
            </button>
            <button
                class="flex-1 py-2 text-center rounded-lg text-on-surface-variant font-heading-md text-heading-md hover:bg-surface-container transition-colors">
                Lịch sử đơn
            </button>
        </div>
        <!-- Leave Balance Card -->
        <div
            class="bg-primary-container rounded-xl p-4 mb-6 text-on-primary-container shadow-sm flex items-center justify-between">
            <div>
                <p class="font-label-caps text-label-caps opacity-90">Phép năm còn lại</p>
                <p class="font-display-time text-display-time">12.5</p>
            </div>
            <div class="bg-white/20 p-3 rounded-full">
                <span class="material-symbols-outlined text-4xl" data-weight="fill"
                    style="font-variation-settings: 'FILL' 1;">date_range</span>
            </div>
        </div>
        <!-- Leave Request Form -->
        <form class="space-y-6">
            <!-- Leave Type -->
            <div class="space-y-2">
                <label class="font-label-caps text-label-caps text-on-surface-variant px-1">Loại nghỉ phép</label>
                <div class="relative">
                    <select
                        class="w-full bg-white border border-outline-variant rounded-xl px-4 py-3 appearance-none focus:ring-2 focus:ring-primary focus:border-transparent outline-none font-body-main text-body-main">
                        <option>Nghỉ phép năm</option>
                        <option>Nghỉ ốm (có BHXH)</option>
                        <option>Nghỉ việc riêng</option>
                        <option>Nghỉ không lương</option>
                    </select>
                    <span
                        class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-outline">expand_more</span>
                </div>
            </div>
            <!-- Time Picker Range -->
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="font-label-caps text-label-caps text-on-surface-variant px-1">Từ ngày</label>
                    <div class="relative">
                        <input
                            class="w-full bg-white border border-outline-variant rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary focus:border-transparent outline-none font-body-main text-body-main"
                            type="date" />
                        <span
                            class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-outline text-sm">calendar_today</span>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="font-label-caps text-label-caps text-on-surface-variant px-1">Đến ngày</label>
                    <div class="relative">
                        <input
                            class="w-full bg-white border border-outline-variant rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary focus:border-transparent outline-none font-body-main text-body-main"
                            type="date" />
                        <span
                            class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-outline text-sm">calendar_today</span>
                    </div>
                </div>
            </div>
            <!-- Calculated Days -->
            <div
                class="bg-surface-container-lowest border border-dashed border-outline-variant rounded-xl p-4 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary">info</span>
                    <span class="font-body-main text-body-main text-on-surface">Tổng số ngày nghỉ:</span>
                </div>
                <span class="font-heading-md text-heading-md text-primary">0 ngày</span>
            </div>
            <!-- Reason TextArea -->
            <div class="space-y-2">
                <label class="font-label-caps text-label-caps text-on-surface-variant px-1">Lý do nghỉ</label>
                <textarea
                    class="w-full bg-white border border-outline-variant rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary focus:border-transparent outline-none font-body-main text-body-main resize-none"
                    placeholder="Nhập lý do chi tiết..." rows="3"></textarea>
            </div>
            <!-- File Upload -->
            <div class="space-y-2">
                <label class="font-label-caps text-label-caps text-on-surface-variant px-1">Đính kèm (Minh chứng nếu
                    có)</label>
                <div
                    class="border-2 border-dashed border-outline-variant rounded-xl p-6 flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container-high transition-colors cursor-pointer">
                    <span class="material-symbols-outlined text-4xl text-outline mb-2">cloud_upload</span>
                    <p class="font-status-text text-status-text text-on-surface-variant">Nhấn để tải lên hoặc kéo thả
                        tệp</p>
                    <p class="text-[10px] text-outline mt-1 uppercase">PDF, JPG, PNG (Max 5MB)</p>
                </div>
            </div>
            <!-- Action Buttons -->
            <div class="flex flex-col gap-3 pt-4">
                <button
                    class="w-full bg-primary text-on-primary py-4 rounded-xl font-heading-md text-heading-md shadow-md active:scale-[0.98] transition-transform flex items-center justify-center gap-2"
                    type="submit">
                    <span class="material-symbols-outlined">send</span>
                    Gửi đơn
                </button>
                <button
                    class="w-full bg-white border border-outline text-on-surface py-4 rounded-xl font-heading-md text-heading-md active:scale-[0.98] transition-transform"
                    type="button">
                    Hủy
                </button>
            </div>
        </form>
    </main>
    <!-- Bottom Nav Bar -->
    <nav
        class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 py-3 pb-safe bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-t border-slate-100 dark:border-slate-800 shadow-[0_-2px_10px_rgba(0,0,0,0.06)]">
        <div
            class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 scale-95 active:scale-90 transition-transform duration-150">
            <span class="material-symbols-outlined">home</span>
            <span class="font-manrope text-[10px] font-semibold">Home</span>
        </div>
        <div
            class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 scale-95 active:scale-90 transition-transform duration-150">
            <span class="material-symbols-outlined">history</span>
            <span class="font-manrope text-[10px] font-semibold">History</span>
        </div>
        <div
            class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 scale-95 active:scale-90 transition-transform duration-150">
            <span class="material-symbols-outlined">fingerprint</span>
            <span class="font-manrope text-[10px] font-semibold">Check-in</span>
        </div>
        <div
            class="flex flex-col items-center justify-center text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 rounded-xl px-3 py-1 scale-95 active:scale-90 transition-transform duration-150">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">event_note</span>
            <span class="font-manrope text-[10px] font-semibold">Request</span>
        </div>
        <div
            class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 scale-95 active:scale-90 transition-transform duration-150">
            <span class="material-symbols-outlined">person</span>
            <span class="font-manrope text-[10px] font-semibold">Profile</span>
        </div>
    </nav>
</body>

</html>
